<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Mój zeszyt polskiego</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;0,7..72,700;1,7..72,400&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a squared school notebook (zeszyt w kratkę) with a red margin; flashcards are index cards (fiszki) laid on it. */
:root {
  --paper: #F2F5F8;
  --grid: rgba(44, 86, 150, 0.075);
  --card: #FFFFFF;
  --ink: #17223A;
  --muted: #5A6579;
  --line: #D6DDE6;
  --accent: #2446B5;
  --accent-ink: #FFFFFF;
  --accent-soft: #E4EAFB;
  --margin: #D4433D;
  --rule: rgba(36, 70, 181, 0.10);
  --again: #C23A34;
  --hard: #A86A12;
  --good: #1D7F55;
  --easy: #2A64A8;
  --new: #2A64A8;
  --learn: #C23A34;
  --review: #1D7F55;
  --shadow: 0 1px 2px rgba(23, 34, 58, 0.06), 0 8px 24px rgba(23, 34, 58, 0.08);
  --f-display: "Literata", "Georgia", "Times New Roman", serif;
  --f-body: "Source Sans 3", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #10151E; --grid: rgba(150, 180, 235, 0.055); --card: #19202C; --ink: #E5E9F1; --muted: #98A2B4;
    --line: #2B3444; --accent: #93A8FF; --accent-ink: #0F1422; --accent-soft: #222C48; --margin: #EE7069;
    --rule: rgba(147, 168, 255, 0.08); --again: #EE7069; --hard: #E0A84A; --good: #4DBE8B; --easy: #7FB0EE;
    --new: #7FB0EE; --learn: #EE7069; --review: #4DBE8B; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #10151E; --grid: rgba(150, 180, 235, 0.055); --card: #19202C; --ink: #E5E9F1; --muted: #98A2B4;
  --line: #2B3444; --accent: #93A8FF; --accent-ink: #0F1422; --accent-soft: #222C48; --margin: #EE7069;
  --rule: rgba(147, 168, 255, 0.08); --again: #EE7069; --hard: #E0A84A; --good: #4DBE8B; --easy: #7FB0EE;
  --new: #7FB0EE; --learn: #EE7069; --review: #4DBE8B; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  background-color: var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 22px 22px;
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.5;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
button, input, select { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; line-height: 1.2; }
.wrap { max-width: 1080px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--paper) 92%, transparent); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px 20px; flex-wrap: wrap; padding-block: 10px; }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand b { font-family: var(--f-display); font-size: 1.25rem; font-weight: 700; letter-spacing: -0.01em; }
.brand span { font-family: var(--f-mono); font-size: .72rem; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
.tabs { display: flex; gap: 4px; }
.tab { border: 0; background: none; padding: 6px 12px; border-radius: 8px; cursor: pointer; display: grid; text-align: center; line-height: 1.15; }
.tab .pl { font-weight: 700; font-size: .98rem; }
.tab .en { font-size: .7rem; color: var(--muted); font-family: var(--f-mono); letter-spacing: .04em; text-transform: uppercase; }
.tab:hover { background: var(--accent-soft); }
.tab[aria-current="page"] { background: var(--accent); color: var(--accent-ink); }
.tab[aria-current="page"] .en { color: inherit; opacity: .8; }
.sync { font-family: var(--f-mono); font-size: .7rem; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.sync i { width: 7px; height: 7px; border-radius: 50%; background: var(--hard); display: inline-block; }
.sync.on i { background: var(--good); }

main { padding-block: 28px 64px; }
.view[hidden] { display: none; }
.eyebrow { font-family: var(--f-mono); font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.btn { border: 1px solid var(--line); background: var(--card); padding: 9px 16px; border-radius: 10px; cursor: pointer; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; color: var(--ink); }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.small { padding: 5px 10px; font-size: .88rem; border-radius: 8px; }
.linkbtn { border: 0; background: none; color: var(--accent); cursor: pointer; padding: 0; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
.say { border: 1px solid var(--line); background: var(--card); width: 30px; height: 30px; border-radius: 50%; cursor: pointer; display: none; place-items: center; flex: none; color: var(--accent); padding: 0; }
.has-voice .say { display: inline-grid; }
.say svg { width: 15px; height: 15px; }
.say:hover { border-color: var(--accent); background: var(--accent-soft); }

/* Fiszki (home) */
.home { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 24px; align-items: start; }
.hello h1 { font-size: clamp(2rem, 5vw, 2.8rem); font-weight: 700; letter-spacing: -0.02em; }
.hello p { margin: 6px 0 0; color: var(--muted); }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px; }
.panel h2 { font-size: 1.15rem; }
.counts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 16px 0; }
.count { border-top: 3px solid currentColor; padding-top: 8px; }
.count b { display: block; font-family: var(--f-display); font-size: 2.1rem; line-height: 1; font-variant-numeric: tabular-nums; }
.count span { font-size: .85rem; color: var(--muted); }
.count.n { color: var(--new); } .count.l { color: var(--learn); } .count.r { color: var(--review); }
.count b, .count span { color: var(--ink); }
.count.n b { color: var(--new); } .count.l b { color: var(--learn); } .count.r b { color: var(--review); }
.opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 16px; margin-bottom: 18px; }
.field { display: grid; gap: 4px; min-width: 0; }
.field label, .field .lbl { font-size: .82rem; color: var(--muted); font-weight: 600; }
select, input[type="text"], input[type="search"] { border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 8px 10px; width: 100%; min-width: 0; }
.check { display: flex; gap: 8px; align-items: flex-start; font-size: .92rem; cursor: pointer; }
.check input { margin-top: 3px; accent-color: var(--accent); width: 16px; height: 16px; flex: none; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.side { display: grid; gap: 16px; }
.stat-row { display: flex; gap: 20px; flex-wrap: wrap; }
.stat b { font-family: var(--f-display); font-size: 1.6rem; display: block; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat span { font-size: .82rem; color: var(--muted); }
.bars { width: 100%; height: auto; display: block; margin-top: 12px; }
.next-class { display: grid; gap: 8px; }
.next-class .when { font-family: var(--f-display); font-size: 1.15rem; font-weight: 600; }
.lesson-links { display: grid; gap: 8px; margin-top: 4px; }
.lesson-link { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; text-decoration: none; color: var(--ink); background: var(--card); }
.lesson-link:hover { border-color: var(--accent); }
.lesson-link small { color: var(--muted); font-family: var(--f-mono); font-size: .72rem; white-space: nowrap; }
.progress { height: 6px; border-radius: 3px; background: var(--accent-soft); overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--good); border-radius: 3px; }

/* Study */
.study { max-width: 680px; margin: 0 auto; display: grid; gap: 16px; }
.study-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.qcounts { font-family: var(--f-mono); font-size: .9rem; display: flex; gap: 14px; font-variant-numeric: tabular-nums; }
.qcounts .n { color: var(--new); } .qcounts .l { color: var(--learn); } .qcounts .r { color: var(--review); }
.qcounts .cur { text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 2px; }
.fiszka {
  background-color: var(--card);
  background-image: repeating-linear-gradient(transparent 0 31px, var(--rule) 31px 32px);
  background-position: 0 64px;
  border: 1px solid var(--line); border-radius: 6px; box-shadow: var(--shadow);
  min-height: 320px; padding: 24px 28px 28px; position: relative; display: grid; align-content: start; gap: 14px;
}
.fiszka::before { content: ""; position: absolute; left: 0; right: 0; top: 56px; height: 2px; background: var(--margin); opacity: .7; }
.fiszka .eyebrow { min-height: 22px; }
.face { display: grid; justify-items: center; text-align: center; gap: 10px; padding-top: 24px; }
.face .prompt { font-size: .85rem; color: var(--muted); }
.face .big { font-family: var(--f-display); font-size: clamp(1.7rem, 5.5vw, 2.5rem); font-weight: 600; line-height: 1.2; overflow-wrap: anywhere; }
.face .person { font-family: var(--f-mono); font-size: 1rem; color: var(--accent); }
.answer { border-top: 1px dashed var(--line); padding-top: 18px; display: grid; justify-items: center; text-align: center; gap: 8px; }
.answer .big { font-family: var(--f-display); font-size: clamp(1.4rem, 4.5vw, 2rem); font-weight: 600; overflow-wrap: anywhere; }
.answer .note { font-size: .92rem; color: var(--muted); max-width: 46ch; }
.row-say { display: inline-flex; align-items: center; gap: 10px; }
.rate { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.rate.two { grid-template-columns: repeat(2, 1fr); }
.rate button { border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 10px 6px; cursor: pointer; display: grid; gap: 2px; font-weight: 700; }
.rate button small { font-family: var(--f-mono); font-weight: 400; font-size: .74rem; color: var(--muted); }
.rate button kbd { font-family: var(--f-mono); font-size: .66rem; color: var(--muted); font-weight: 400; }
.rate .again { color: var(--again); } .rate .hard { color: var(--hard); } .rate .good { color: var(--good); } .rate .easy { color: var(--easy); }
.rate button:hover { border-color: currentColor; }
.reveal { width: 100%; justify-content: center; padding: 14px; font-size: 1.05rem; }
.hint { text-align: center; font-size: .8rem; color: var(--muted); font-family: var(--f-mono); }
.done { text-align: center; display: grid; gap: 12px; justify-items: center; padding: 40px 20px; }
.done h2 { font-size: 2rem; }

/* Lekcje */
.lessons { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 28px; align-items: start; }
.lnav { display: grid; gap: 8px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 84px); }
.lnav a { display: grid; gap: 2px; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); text-decoration: none; color: var(--ink); }
.lnav a[aria-current="true"] { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--margin); }
.lnav a b { font-family: var(--f-display); font-weight: 600; }
.lnav a small { font-family: var(--f-mono); font-size: .72rem; color: var(--muted); }
.sheet { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 28px 32px 36px 56px; position: relative; display: grid; gap: 30px; min-width: 0; }
.sheet::before { content: ""; position: absolute; top: 0; bottom: 0; left: 36px; width: 2px; background: var(--margin); opacity: .55; }
.sheet header { display: grid; gap: 6px; }
.sheet header h2 { font-size: clamp(1.6rem, 4vw, 2.2rem); font-weight: 700; }
.sheet header .en { font-family: var(--f-display); font-style: italic; color: var(--muted); font-size: 1.1rem; }
.topics { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.topics span { font-size: .82rem; background: var(--accent-soft); color: var(--ink); padding: 3px 10px; border-radius: 99px; }
.sec { display: grid; gap: 12px; min-width: 0; }
.sec > h3 { font-size: 1.2rem; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.sec > h3 small { font-family: var(--f-mono); font-size: .72rem; color: var(--muted); letter-spacing: .05em; text-transform: uppercase; font-weight: 400; }
.sec p { margin: 0; max-width: 68ch; }
.phrases { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 28px; }
.phrase { display: flex; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); min-width: 0; }
.phrase .t { min-width: 0; flex: 1; }
.phrase .p { font-family: var(--f-display); font-weight: 600; display: block; overflow-wrap: anywhere; }
.phrase .e { font-size: .9rem; color: var(--muted); display: block; }
.phrase .e em { font-style: normal; color: var(--accent); font-size: .82rem; }
.scroll { overflow-x: auto; }
table.grid { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; min-width: 460px; }
table.grid th, table.grid td { border-bottom: 1px solid var(--line); padding: 7px 10px; text-align: left; vertical-align: top; }
table.grid thead th { font-family: var(--f-display); font-size: 1rem; border-bottom: 2px solid var(--ink); }
table.grid thead th small { display: block; font-family: var(--f-body); font-weight: 400; color: var(--muted); font-size: .78rem; }
table.grid tbody th { font-family: var(--f-mono); font-weight: 400; font-size: .82rem; color: var(--muted); white-space: nowrap; }
table.grid td { font-family: var(--f-display); }
table.grid td b { color: var(--accent); font-weight: 700; }
.callout { border-left: 3px solid var(--margin); padding: 8px 14px; background: var(--accent-soft); border-radius: 0 8px 8px 0; font-size: .95rem; }
.callout p + p { margin-top: 6px; }
.gender { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.gender > div { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; gap: 6px; align-content: start; }
.gender .dem { font-family: var(--f-display); font-size: 1.6rem; font-weight: 700; color: var(--accent); line-height: 1; }
.gender .end { font-family: var(--f-mono); font-size: .78rem; color: var(--muted); }
.gender ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 4px 10px; font-family: var(--f-display); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--card); padding: 4px 12px; border-radius: 99px; font-family: var(--f-display); cursor: default; }
.has-voice .chip { cursor: pointer; }
.has-voice .chip:hover { border-color: var(--accent); background: var(--accent-soft); }
.pron { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 28px; }
.pron div { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); align-items: baseline; }
.pron b { font-family: var(--f-display); font-size: 1.15rem; color: var(--accent); }
.pron span { min-width: 0; }
.pron em { font-style: normal; font-family: var(--f-display); font-weight: 600; }
.pron small { display: block; color: var(--muted); font-size: .84rem; }
.refs { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.refs li { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.tag { font-family: var(--f-mono); font-size: .7rem; letter-spacing: .04em; text-transform: uppercase; padding: 2px 8px; border-radius: 5px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.tag.zeszyt { background: color-mix(in srgb, var(--margin) 14%, transparent); color: var(--margin); }
.tag.online { background: color-mix(in srgb, var(--good) 14%, transparent); color: var(--good); }

/* Sytuacje */
.sheet header .intro { margin: 6px 0 0; max-width: 68ch; }
.dlg { display: grid; gap: 8px; }
.line { display: grid; grid-template-columns: 96px minmax(0, 1fr) auto; gap: 12px; align-items: start; padding: 10px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); }
.line.me { background: var(--accent-soft); border-color: transparent; }
.line .who { font-family: var(--f-mono); font-size: .72rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); padding-top: 4px; overflow-wrap: anywhere; }
.line.me .who { color: var(--accent); }
.line .t { min-width: 0; }
.line .p { font-family: var(--f-display); font-weight: 600; display: block; overflow-wrap: anywhere; }
.line .e { font-size: .9rem; color: var(--muted); display: block; }

/* Zadania */
.hw { display: grid; gap: 20px; max-width: 820px; }
.hw-group { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: grid; gap: 14px; }
.hw-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.hw-head h2 { font-size: 1.2rem; }
.hw-item { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; border-top: 1px solid var(--line); }
.hw-item input { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--good); flex: none; cursor: pointer; }
.hw-item label { display: grid; gap: 4px; cursor: pointer; flex: 1; min-width: 0; }
.hw-item .what { font-weight: 600; }
.hw-item.isdone .what { text-decoration: line-through; color: var(--muted); }
.hw-item .meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: .88rem; color: var(--muted); }
.pill { font-family: var(--f-mono); font-size: .72rem; padding: 2px 8px; border-radius: 99px; border: 1px solid currentColor; white-space: nowrap; }
.pill.ok { color: var(--good); } .pill.todo { color: var(--hard); }

/* Słówka */
.words-tools { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 12px; margin-bottom: 16px; }
.words { display: grid; gap: 0; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 4px 18px; }
.word { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); }
.word:last-child { border-bottom: 0; }
.word .p { font-family: var(--f-display); font-weight: 600; overflow-wrap: anywhere; }
.word .e { color: var(--muted); font-size: .92rem; overflow-wrap: anywhere; }
.word .st { display: flex; gap: 8px; align-items: center; justify-content: flex-end; }
.status { font-family: var(--f-mono); font-size: .7rem; padding: 2px 8px; border-radius: 99px; white-space: nowrap; border: 1px solid currentColor; }
.status.new { color: var(--new); } .status.learn { color: var(--learn); } .status.review { color: var(--review); } .status.due { color: var(--review); background: color-mix(in srgb, var(--review) 14%, transparent); }
.addform { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; margin-bottom: 20px; display: grid; gap: 12px; }
.addform .row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1fr) auto; gap: 10px; align-items: end; }
.empty { padding: 24px 0; text-align: center; color: var(--muted); }
.del { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: .8rem; padding: 2px 4px; }
.del.armed { color: var(--again); font-weight: 700; }

  /* ---------- state ---------- */

  function blank() {

  }

  }
  async function pushRemote() {

      setSync("account");
    } catch (e) {

      else { setSync("error"); if (e && (e.code === "invalid_argument" || e.code === "revoked" || e.code === "not_granted")) sync.ref = null; }

  async function initRemote() {
    if (!window.claude || typeof window.claude.use !== "function") return;
    try {
      const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
      if (!db || !user) return;
      const uid = await user.id();
      if (!uid) return;
      const ref = db.doc("data/users/" + uid + "/progress");
      const snap = await ref.get();
      sync.ref = ref;
      if (snap.exists) {
        const remote = normalize(snap.data());
        if (remote.updatedAt > S.updatedAt) {
          S = remote;
          try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) { /* ignore */ }
          buildCards();
          if (!session) render();
        } else if (S.updatedAt > remote.updatedAt) {
          pushRemote();
        }
        setSync("account");
      } else if (S.updatedAt > 0) {
        await pushRemote();
      } else {
        setSync("account");
      }

      setSync("local");
    }
  }

  /* ---------- cards ---------- */
  let CARDS = [], BY_ID = {};
  function buildCards() {
    CARDS = []; BY_ID = {};
    const add = (c) => { if (BY_ID[c.id]) return; BY_ID[c.id] = c; CARDS.push(c); };
    LESSONS.forEach((l) => {
      l.vocab.forEach((g) => g.cards.forEach((c) => {
        add({ id: "v:" + c[0], kind: "v", pl: c[0], en: c[1], note: c[2] || "", lesson: l.id, group: g.name });
      }));
      l.sections.filter((s) => s.type === "conj").forEach((s) => s.verbs.forEach((v) => v.forms.forEach((f, i) => {
        add({ id: "c:" + v.inf + ":" + i, kind: "c", inf: v.inf, en: v.en, person: i, form: f, lesson: l.id, group: "Odmiana" });
      })));
    });
    SITS.forEach((s) => {
      (s.groups || []).forEach((g) => g.cards.forEach((c) => {
        add({ id: "v:" + c[0], kind: "v", pl: c[0], en: c[1], note: c[2] || "", lesson: s.id, group: g.name });
      }));
      SIT_PARTS.forEach(([part, label]) => (s[part] || []).forEach((c) => {
        add({ id: "v:" + c[0], kind: "v", pl: c[0], en: c[1], note: c[2] || "", lesson: s.id, group: label });
      }));
    });
    S.custom.forEach((c) => add({ id: "v:my:" + c.id, kind: "v", pl: c.pl, en: c.en, note: c.note || "", lesson: "mine", group: "Moje słówka", customId: c.id }));

  function deckLabel(key) {

    if (key === "mine") return "My own words";
    if (key === "sit") return "All situations";
    const s = sitById(key);
    if (s) return "Sytuacja · " + s.title;
    const l = lessonById(key);
    return l ? "Lekcja " + l.n + " · " + shortDate(parseDate(l.date)) : key;
  }
  function deckOptions() {
    return [["all", deckLabel("all")]].concat(LESSONS.map((l) => [l.id, deckLabel(l.id)]), [["sit", deckLabel("sit")]], SITS.map((s) => [s.id, deckLabel(s.id)]), [["verbs", deckLabel("verbs")], ["mine", deckLabel("mine")]]);
  }
  function inDeck(c, key) {
    if (key === "all") return true;
    if (key === "verbs") return c.kind === "c";
    if (key === "sit") return c.lesson.startsWith("s-");
    return c.lesson === key;
  }
  function srcLabel(c) {
    if (c.lesson === "mine") return "Moje słówka";
    const s = sitById(c.lesson);
    if (s) return "Sytuacja · " + s.title + " · " + c.group;
    return "Lekcja " + lessonById(c.lesson).n + " · " + c.group;
  }
  // study ids for a deck; vocab cards also get an English → Polish twin when reverse is on
  function poolFor(key, reverse) {
    const out = [];
    CARDS.forEach((c) => {
      if (!inDeck(c, key)) return;
      out.push(c.id);
      if (reverse && c.kind === "v") out.push("r|" + c.id);
    });
    return out;
  }
  const baseId = (sid) => (sid.startsWith("r|") ? sid.slice(2) : sid);

  /* ---------- scheduler (Anki-style SM-2) ---------- */
  function schedule(prev, rating, now) {
    const c = prev ? { ...prev } : { s: "new", step: 0, ivl: 0, ease: 2.5, reps: 0, lapses: 0 };
    const today = dayStart(now);
    c.reps = (c.reps || 0) + 1;
    c.last = now;
    if (c.s === "new" || c.s === "learn") {
      if (rating === 1) { c.s = "learn"; c.step = 0; c.due = now + STEPS[0] * MIN; }
      else if (rating === 2) { c.s = "learn"; c.due = now + (c.step === 0 ? Math.round((STEPS[0] + STEPS[1]) / 2) : STEPS[c.step]) * MIN; }
      else if (rating === 3) {
        const next = (c.s === "new" ? 0 : c.step) + 1;
        if (next >= STEPS.length) { c.s = "review"; c.ivl = 1; c.due = today + DAY; }
        else { c.s = "learn"; c.step = next; c.due = now + STEPS[next] * MIN; }
      } else { c.s = "review"; c.ivl = 4; c.due = today + 4 * DAY; }
    } else if (c.s === "relearn") {
      if (rating === 1) { c.due = now + RELEARN * MIN; }
      else { c.s = "review"; if (rating === 4) c.ivl += 1; c.due = today + c.ivl * DAY; }
    } else {
      if (rating === 1) { c.lapses = (c.lapses || 0) + 1; c.ease = Math.max(1.3, c.ease - 0.2); c.ivl = Math.max(1, Math.round(c.ivl * 0.5)); c.s = "relearn"; c.due = now + RELEARN * MIN; }
      else if (rating === 2) { c.ease = Math.max(1.3, c.ease - 0.15); c.ivl = Math.max(c.ivl + 1, Math.round(c.ivl * 1.2)); c.due = today + c.ivl * DAY; }
      else if (rating === 3) { c.ivl = Math.max(c.ivl + 1, Math.round(c.ivl * c.ease)); c.due = today + c.ivl * DAY; }
      else { c.ease = c.ease + 0.15; c.ivl = Math.max(c.ivl + 1, Math.round(c.ivl * c.ease * 1.3)); c.due = today + c.ivl * DAY; }
    }
    return c;
  }
  function fmtGap(ms) {

  const isLearning = (st) => st && (st.s === "learn" || st.s === "relearn");

  function queueInfo(key, reverse) {

  /* ---------- speech ---------- */
  let plVoice = null, plVoices = [];

  /* ---------- routing ---------- */
  const VIEWS = ["fiszki", "lekcje", "sytuacje", "zadania", "slowka"];
  let view = "fiszki", currentLesson = LESSONS[LESSONS.length - 1].id, currentSit = SITS.length ? SITS[0].id : null, session = null;
  function readHash() {
    const h = (location.hash || "").slice(1);

    else if (sitById(h)) { view = "sytuacje"; currentSit = h; }

  /* ---------- home ---------- */

  function hwOpen(lessons) { let open = 0, all = 0; lessons.forEach((l) => l.homework.forEach((h) => { all++; if (!S.hw[h.id]) open++; })); return { open, all }; }
  function barsSvg() {
    const n = 14, w = 280, h = 64, gap = 4, bw = (w - gap * (n - 1)) / n;
    const vals = [];
    for (let i = n - 1; i >= 0; i--) { const t = Date.now() - i * DAY; vals.push({ v: S.days[dayKey(t)] || 0, d: new Date(t) }); }
    const max = Math.max(10, ...vals.map((x) => x.v));
    let out = '<svg class="bars" viewBox="0 0 ' + w + " " + (h + 16) + '" role="img" aria-label="Cards reviewed per day, last 14 days">';
    out += '<line x1="0" x2="' + w + '" y1="' + h + '" y2="' + h + '" stroke="var(--line)" stroke-width="1"/>';
    vals.forEach((x, i) => {
      const bh = x.v ? Math.max(3, (x.v / max) * (h - 4)) : 0;
      const xx = i * (bw + gap);
      const last = i === n - 1;
      out += '<rect x="' + xx.toFixed(1) + '" y="' + (h - bh).toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + bh.toFixed(1) + '" rx="2" fill="' + (last ? "var(--accent)" : "var(--good)") + '" opacity="' + (last ? 1 : 0.75) + '"><title>' + plDate(x.d) + ": " + x.v + "</title></rect>";

  function renderHome() {

          '<div class="panel">' +

              '<label class="check"><input type="checkbox" id="opt-rev"' + (st.reverse ? " checked" : "") + "><span>Also practise English → Polish</span></label>" +

            "</div>" +

            '<div class="progress" aria-hidden="true"><i style="width:' + (hw.all ? Math.round(((hw.all - hw.open) / hw.all) * 100) : 0) + '%"></i></div>' +
            '<div><button class="linkbtn" data-go="zadania">Open homework</button></div>' +
          "</div>" +
          '<div class="panel next-class"><div class="eyebrow">Sytuacje · your situations</div>' +
            '<div class="muted" style="font-size:.92rem">' + SITS.length + " everyday situations from your life in Warsaw: shop, restaurant, transport, work, home, friends, parents, cooking. To study them on their own, pick “All situations” in the deck menu.</div>" +

            LESSONS.slice().reverse().map((l) => '<a class="lesson-link" href="#' + l.id + '" data-lesson="' + l.id + '"><span><b style="font-family:var(--f-display)">' + l.n + ".</b> " + esc(l.title) + "</span><small>" + shortDate(parseDate(l.date)) + "</small></a>").join("") +
          "</div></div>" +
        "</div>" +
      "</div>";
  }

  /* ---------- study session ---------- */
  function startSession(key) {
    const st = S.settings;
    const q = queueInfo(key, st.reverse);
    const now = Date.now();
    const learning = [], reviews = [], fresh = [];
    q.pool.forEach((id) => {
      const s = S.cards[id];
      if (!s) { if (fresh.length < q.newLeft) fresh.push(id); }
      else if (isLearning(s)) learning.push(id);
      else if (s.due <= now) reviews.push(id);
    });
    reviews.sort((a, b) => S.cards[a].due - S.cards[b].due);
    session = { mode: "srs", key, ids: new Set([...learning, ...reviews, ...fresh]), reviews, fresh, count: 0, cur: null, flipped: false, last: null };
    nextCard();
  }
  function startCram(key) {
    const pool = poolFor(key, S.settings.reverse);
    for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
    session = { mode: "cram", key, queue: pool.slice(0, 20), count: 0, cur: null, flipped: false };
    nextCard();
  }
  function srsCounts() {
    const now = Date.now();
    let l = 0;
    session.ids.forEach((id) => { if (isLearning(S.cards[id])) l++; });
    return {
      n: session.fresh.filter((id) => !S.cards[id]).length,
      l,
      r: session.reviews.filter((id) => S.cards[id] && S.cards[id].s === "review" && S.cards[id].due <= now).length
    };
  }
  function nextCard() {
    session.flipped = false;
    if (session.mode === "cram") { session.cur = session.queue[0] || null; render(); autoSay(); return; }
    const now = Date.now();
    const learningDue = [...session.ids].filter((id) => isLearning(S.cards[id]) && S.cards[id].due <= now && id !== session.last).sort((a, b) => S.cards[a].due - S.cards[b].due);
    const revs = session.reviews.filter((id) => S.cards[id] && S.cards[id].s === "review" && S.cards[id].due <= now);
    const news = session.fresh.filter((id) => !S.cards[id]);
    let pick = learningDue[0] || null;
    if (!pick) {
      if (revs.length && news.length) pick = session.count % 4 === 3 ? news[0] : revs[0];
      else pick = revs[0] || news[0] || null;
    }
    if (!pick) {
      const ahead = [...session.ids].filter((id) => isLearning(S.cards[id]) && S.cards[id].due <= now + LEARN_AHEAD).sort((a, b) => S.cards[a].due - S.cards[b].due);
      pick = ahead.find((id) => id !== session.last) || ahead[0] || null;
    }
    session.cur = pick;
    render();
    autoSay();
  }
  function cardParts(sid) {
    const rev = sid.startsWith("r|");
    const c = BY_ID[baseId(sid)];
    if (!c) return null;
    const where = srcLabel(c);
    if (c.kind === "c") {
      return { where, prompt: "Conjugate", front: '<div class="big">' + esc(c.inf) + '</div><div class="person">' + esc(PERSON_SHORT[c.person]) + " …?</div><div class=\"prompt\">" + esc(c.en) + "</div>", frontSay: null, back: esc(PERSON_SHORT[c.person] + " " + c.form), note: "", sayBack: c.form };
    }
    if (rev) return { where, prompt: "Say it in Polish", front: '<div class="big">' + esc(c.en) + "</div>", frontSay: null, back: esc(c.pl), note: c.note, sayBack: c.pl };
    return { where, prompt: "What does it mean?", front: '<div class="big">' + esc(c.pl) + "</div>", frontSay: c.pl, back: esc(c.en), note: c.note, sayBack: null };
  }
  function autoSay() {
    if (!session || !session.cur || !S.settings.autoSpeak) return;
    const p = cardParts(session.cur);
    if (!p) return;
    if (!session.flipped && p.frontSay) speak(p.frontSay);
    if (session.flipped && p.sayBack) speak(p.sayBack);
  }
  function renderStudy() {
    const el = $("#view-study");
    const top = '<div class="study-top"><button class="btn small" id="end-study">← Back</button>' + (session.mode === "srs" ? (() => { const c = srsCounts(); const cur = session.cur ? (S.cards[session.cur] ? (isLearning(S.cards[session.cur]) ? "l" : "r") : "n") : ""; return '<div class="qcounts" aria-label="Cards left"><span class="n' + (cur === "n" ? " cur" : "") + '" title="new">' + c.n + '</span><span class="l' + (cur === "l" ? " cur" : "") + '" title="learning">' + c.l + '</span><span class="r' + (cur === "r" ? " cur" : "") + '" title="due">' + c.r + "</span></div>"; })() : '<div class="qcounts"><span class="muted">Quick practice · ' + session.queue.length + " left</span></div>") + "</div>";
    if (!session.cur) {
      const later = session.mode === "srs" ? [...session.ids].filter((id) => isLearning(S.cards[id])).length : 0;
      el.innerHTML = '<div class="study">' + top + '<div class="fiszka"><div class="eyebrow"></div><div class="done"><h2>Gotowe!</h2><p class="muted">' +
        (session.count ? "You studied " + session.count + " card" + (session.count === 1 ? "" : "s") + ". " : "") +
        (later ? later + " card" + (later === 1 ? " is" : "s are") + " still in learning and will come back later today." : session.mode === "srs" ? "That's everything for now." : "Practice round finished.") +
        '</p><div class="actions" style="justify-content:center"><button class="btn primary" id="end-study2">Back to Fiszki</button>' + (session.mode === "cram" ? '<button class="btn" id="again-cram">Another round</button>' : "") + "</div></div></div></div>";
      return;
    }
    const p = cardParts(session.cur);
    const prev = S.cards[session.cur];
    let actions;
    if (!session.flipped) {
      actions = '<button class="btn primary reveal" id="flip">Pokaż odpowiedź · Show answer</button><div class="hint">space</div>';
    } else if (session.mode === "cram") {
      actions = '<div class="rate two"><button class="again" data-rate="1">Again<kbd>1</kbd></button><button class="good" data-rate="3">Got it<kbd>3</kbd></button></div>';
    } else {
      const now = Date.now();
      const lab = (r) => fmtGap(schedule(prev, r, now).due - now);
      actions = '<div class="rate">' +
        '<button class="again" data-rate="1">Again<small>' + lab(1) + "</small><kbd>1</kbd></button>" +
        '<button class="hard" data-rate="2">Hard<small>' + lab(2) + "</small><kbd>2</kbd></button>" +
        '<button class="good" data-rate="3">Good<small>' + lab(3) + "</small><kbd>3</kbd></button>" +
        '<button class="easy" data-rate="4">Easy<small>' + lab(4) + "</small><kbd>4</kbd></button></div>";
    }
    el.innerHTML = '<div class="study">' + top +
      '<article class="fiszka" aria-live="polite"><div class="eyebrow">' + esc(p.where) + "</div>" +
        '<div class="face"><div class="prompt">' + esc(p.prompt) + "</div>" + (p.frontSay ? '<div class="row-say">' + p.front + sayBtn(p.frontSay) + "</div>" : p.front) + "</div>" +
        (session.flipped ? '<div class="answer"><div class="row-say"><div class="big">' + p.back + "</div>" + (p.sayBack ? sayBtn(p.sayBack) : "") + "</div>" + (p.note ? '<div class="note">' + esc(p.note) + "</div>" : "") + "</div>" : "") +
      "</article>" + actions + "</div>";
  }
  function flip() { if (!session || !session.cur || session.flipped) return; session.flipped = true; render(); autoSay(); }
  function rate(r) {
    if (!session || !session.cur || !session.flipped) return;
    const id = session.cur;
    session.count++;
    if (session.mode === "cram") {
      session.queue.shift();
      if (r === 1) session.queue.splice(Math.min(3, session.queue.length), 0, id);
      nextCard();
      return;
    }
    const now = Date.now(), k = dayKey(now);
    if (!S.cards[id]) S.newByDay[k] = (S.newByDay[k] || 0) + 1;
    S.cards[id] = schedule(S.cards[id], r, now);
    S.days[k] = (S.days[k] || 0) + 1;
    session.last = id;
    save();
    nextCard();
  }
  function endSession() { session = null; try { window.speechSynthesis && window.speechSynthesis.cancel(); } catch (e) { /* ignore */ } }

  /* ---------- lessons ---------- */
  function renderSection(s) {

    } else if (s.type === "conj") {

        s.rows.map((r) => "<tr><td>" + adjEnd(r[0]) + "</td><td>" + adjEnd(r[1]) + "</td><td>" + adjEnd(r[2]) + '</td><td style="font-family:var(--f-body);color:var(--muted);font-size:.9rem">' + esc(r[3]) + "</td></tr>").join("") + "</tbody></table></div>";

    }

    if (s.type === "note") body = '<div class="callout">' + s.html + "</div>";
    return '<section class="sec"><h3>' + esc(s.title) + (s.en ? " <small>" + esc(s.en) + "</small>" : "") + "</h3>" + body + "</section>";
  }
  function sayBtnInline(text) { return plVoice ? sayBtn(text.split(",")[0]).replace('class="say"', 'class="say" style="width:24px;height:24px;vertical-align:middle"') : ""; }
  function highlightEnding(f) {
    const m = ["iecie", "iemy", "iesz", "ieją", "ecie", "emy", "esz", "eją", "acie", "amy", "asz", "ają", "ście", "śmy", "em", "am", "ś", "ą", "sz", "m"].find((e) => f.endsWith(e) && f.length > e.length);

        '<button class="btn primary" type="submit">Add</button></div><div id="add-msg" class="muted" style="font-size:.88rem" aria-live="polite"></div></form>' +
      '<div class="words-tools"><div class="field"><label for="w-q">Search</label><input type="search" id="w-q" placeholder="Search Polish or English" value="' + esc(wordFilter.q) + '"></div>' +
        '<div class="field"><label for="w-deck">Lesson</label><select id="w-deck">' + deckOptions().filter((o) => o[0] !== "verbs").map((o) => '<option value="' + o[0] + '"' + (o[0] === wordFilter.deck ? " selected" : "") + ">" + esc(o[1]) + "</option>").join("") + "</select></div></div>" +
      '<div class="listhead"><span class="eyebrow" id="wordcount"></span><span class="muted" style="font-size:.82rem">Status is for Polish → English</span></div>' +
      '<div class="words" id="wordlist"></div>';
    renderWordList();
  }

  /* ---------- events ---------- */
  document.addEventListener("click", (e) => {
    const t = e.target.closest("button, a, .chip");
    if (!t) return;
    if (t.classList.contains("tab")) return go(t.dataset.view);
    if (t.dataset.say) { e.preventDefault(); return speak(t.dataset.say); }
    if (t.dataset.lesson) { e.preventDefault(); return go("lekcje", t.dataset.lesson); }
    if (t.dataset.sit) { e.preventDefault(); return go("sytuacje", t.dataset.sit); }
    if (t.dataset.go) { e.preventDefault(); return go(t.dataset.go); }
    if (t.dataset.study) { S.settings.deck = t.dataset.study; save(); startSession(t.dataset.study); window.scrollTo(0, 0); return; }
    if (t.dataset.cram) { startCram(t.dataset.cram); window.scrollTo(0, 0); return; }
    if (t.dataset.rate) return rate(Number(t.dataset.rate));
    if (t.dataset.del) {
      if (!t.classList.contains("armed")) { t.classList.add("armed"); t.textContent = "Delete?"; setTimeout(() => { if (t.isConnected) { t.classList.remove("armed"); t.textContent = "Delete"; } }, 3000); return; }
      S.custom = S.custom.filter((c) => c.id !== t.dataset.del);
      ["v:my:" + t.dataset.del, "r|v:my:" + t.dataset.del].forEach((k) => delete S.cards[k]);
      save(); buildCards(); renderWordList(); return;
    }
    switch (t.id) {
      case "go-study": startSession(S.settings.deck); window.scrollTo(0, 0); break;
      case "go-cram": startCram(S.settings.deck); window.scrollTo(0, 0); break;
      case "flip": flip(); break;
      case "end-study": case "end-study2": endSession(); render(); break;
      case "again-cram": startCram(session.key); break;
    }
  });
  document.addEventListener("change", (e) => {
    const t = e.target;
    if (t.id === "opt-deck") { S.settings.deck = t.value; save(); renderHome(); }
    else if (t.id === "opt-new") { S.settings.newPerDay = Number(t.value); save(); renderHome(); }
    else if (t.id === "opt-rev") { S.settings.reverse = t.checked; save(); renderHome(); }
    else if (t.id === "opt-say") { S.settings.autoSpeak = t.checked; save(); }
    else if (t.id === "opt-voice") { S.settings.voice = t.value; save(); pickVoice(); speak("Dzień dobry! Mam na imię Anna."); }
    else if (t.dataset.hw) { if (t.checked) S.hw[t.dataset.hw] = Date.now(); else delete S.hw[t.dataset.hw]; save(); renderHomework(); $("#hw-" + t.dataset.hw) && $("#hw-" + t.dataset.hw).focus(); }
    else if (t.id === "w-deck") { wordFilter.deck = t.value; renderWordList(); }
  });
  document.addEventListener("input", (e) => { if (e.target.id === "w-q") { wordFilter.q = e.target.value; renderWordList(); } });
  document.addEventListener("submit", (e) => {
    if (e.target.id !== "addform") return;
    e.preventDefault();
    const pl = $("#add-pl").value.trim(), en = $("#add-en").value.trim(), note = $("#add-note").value.trim();
    if (!pl || !en) { $("#add-msg").textContent = "Fill in both the Polish and the English."; return; }
    if (S.custom.some((c) => c.pl.toLowerCase() === pl.toLowerCase())) { $("#add-msg").textContent = "“" + pl + "” is already in your words."; return; }
    S.custom.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), pl, en, note, added: Date.now() });
    save(); buildCards();
    $("#add-pl").value = ""; $("#add-en").value = ""; $("#add-note").value = "";
    $("#add-msg").textContent = "Added “" + pl + "”. It will show up as a new card.";
    $("#add-pl").focus();
    renderWordList();
  });
  document.addEventListener("keydown", (e) => {
    if (!session || e.target.matches("input, select, textarea")) return;
    if (e.key === "Escape") { endSession(); render(); return; }
    if (!session.cur) return;
    if (!session.flipped && (e.key === " " || e.key === "Enter")) { e.preventDefault(); flip(); return; }
    if (session.flipped) {
      if (e.key === " " || e.key === "Enter") { e.preventDefault(); rate(3); return; }
      if (["1", "2", "3", "4"].includes(e.key)) {
        const r = Number(e.key);
        if (session.mode === "cram" && (r === 2 || r === 4)) return;
        rate(r);
      }
    }
  });

  buildCards();
  readHash();
  render();
  initRemote();
})();
</script>

</body>
</html>
